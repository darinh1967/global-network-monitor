name: Global Network Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run network monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

        run: python monitor.py

      - name: Save incident history
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            echo "No state changes to save."
            exit 0
          fi

          git config user.name "global-network-monitor"
          git config user.email "global-network-monitor@users.noreply.github.com"

          git add state.json
          git commit -m "Update network monitoring state [skip ci]"
          git push
