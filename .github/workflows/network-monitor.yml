name: Global Network Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  
  workflow_dispatch:

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run network monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

        run: python monitor.py

            - name: Save monitoring state
        run: |
          FILES_TO_SAVE=""

          if [ -f state.json ]; then
            FILES_TO_SAVE="$FILES_TO_SAVE state.json"
          fi

          if [ -f correlation-state.json ]; then
            FILES_TO_SAVE="$FILES_TO_SAVE correlation-state.json"
          fi

          if [ -z "$FILES_TO_SAVE" ]; then
            echo "No state files were found."
            exit 0
          fi

          if git diff --quiet -- $FILES_TO_SAVE; then
            echo "No state changes to save."
            exit 0
          fi

          git config user.name "global-network-monitor"
          git config user.email "global-network-monitor@users.noreply.github.com"

          git add $FILES_TO_SAVE
          git commit -m "Update monitoring state [skip ci]"
          git push
